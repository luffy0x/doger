schema: spec-driven

context: |
  Project: doger, a jd-activity-keeper.
  Product shape: a macOS-first, local-only Codex skill backed by deterministic TypeScript scripts.
  Scheduling: a Codex scheduled task runs every eight hours, anchored to the first confirmed successful refresh.
  Authentication: agent-browser is used for interactive bootstrap and explicit reauthentication only.
  Execution: routine refreshes use curl; credentials must never enter model context, logs, command arguments, fixtures, or version control.
  MVP scope: one JD account and one application record.
  Runtime: Node.js 24, TypeScript, curl, agent-browser, macOS Keychain.

rules:
  proposal:
    - State explicit in-scope and out-of-scope behavior.
    - Include security and rollback impact.
  specs:
    - Use SHALL requirements and WHEN/THEN scenarios.
    - Cover success, authentication expiry, rate limiting, ambiguous responses, missed schedules, and secret redaction.
  design:
    - Keep deterministic code responsible for credentials and HTTP execution; Codex only orchestrates and reports redacted outcomes.
    - Include architecture and sequence diagrams for scheduled and reauthentication flows.
  tasks:
    - Keep each task independently verifiable.
    - Require mock-based tests before any live JD request.
